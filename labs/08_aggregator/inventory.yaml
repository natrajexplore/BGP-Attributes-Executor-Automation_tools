# Lab 08 AGGREGATOR: a group HQ (AS 65000) that summarises two subsidiaries with their own AS numbers.
# The shared 8-router lab cannot show a real AS_SET, because all its components are inside AS 65000.
# Here the components come from AS 65010 and AS 65020, so 'as-set' produces a path like '65000 {65010,65020}'.
# Generate the EVE-NG file with:  python backend/scripts/build_lab.py --inventory labs/08_aggregator/inventory.yaml --out labs/08_aggregator/08_aggregator.unl

defaults:
  username: lab
  password: lab123
  secret: lab123
  mgmt_gateway: 192.168.99.1
  mgmt_mask: 255.255.255.0

lab:
  name: bgp-attr-08-aggregator
  uuid: 298e09f0-a687-417a-b3f7-c27cdb611c9c
  template: c7200
  image: c7200-adventerprisek9-mz.152-4.S6
  npe: npe-400
  ram: 256
  nvram: 128
  idlepc: "0x606df838"
  io_adapter: C7200-IO-FE
  slots: [PA-8E]
  mgmt_interface: fa0/0
  mgmt_network:
    type: pnet1
    name: MGMT-Cloud1

links:
  - {a: SUB-A,   a_if: e1/0, b: HQ-EDGE, b_if: e1/0}   # 172.16.10.0/30  subsidiary A (AS 65010) to HQ
  - {a: SUB-B,   a_if: e1/0, b: HQ-EDGE, b_if: e1/1}   # 172.16.20.0/30  subsidiary B (AS 65020) to HQ
  - {a: HQ-EDGE, a_if: e1/2, b: ISP,     b_if: e1/0}   # 172.16.100.0/30 HQ to provider (AS 65001)

globals:
  as_enterprise: 65000
  aggregate_net: 10.10.0.0
  aggregate_mask: 255.255.0.0

devices:
  SUB-A:
    role: subsidiary
    asn: 65010
    mgmt_ip: 192.168.99.11
    router_id: 10.255.10.1
    canvas: [150, 150]
  SUB-B:
    role: subsidiary
    asn: 65020
    mgmt_ip: 192.168.99.12
    router_id: 10.255.20.1
    canvas: [150, 400]
  HQ-EDGE:
    role: edge
    asn: 65000
    mgmt_ip: 192.168.99.21
    router_id: 10.255.0.1
    canvas: [400, 275]
  ISP:
    role: provider
    asn: 65001
    mgmt_ip: 192.168.99.31
    router_id: 10.255.1.1
    canvas: [650, 275]
