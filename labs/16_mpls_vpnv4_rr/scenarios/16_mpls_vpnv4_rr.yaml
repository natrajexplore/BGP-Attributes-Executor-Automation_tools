title: "VPNv4 route reflector - two PEs lose client status and stop hearing each other"
attribute: ORIGINATOR_ID
summary: >
  The RR reflects routes between four PE clients. The scenario removes "route-reflector-client" for PE1 and PE4 only.
  A route-reflector reflects a client's route to every peer, but a non-client's route only to clients, so the two
  non-clients no longer receive each other's routes. PE1 and PE4 lose each other while PE2 and PE3 still hear both,
  and the RR itself still holds both routes.
template: 16_mpls_vpnv4_rr.j2
targets: [RR]
vars: {}
soft_clear: true
settle_seconds: 60
verify:
  - device: PE1
    command: "show ip route vrf CUST 10.4.0.0"
    expect_regex: "not in table"
  - device: PE2
    command: "show ip route vrf CUST 10.4.0.0"
    expect_regex: "Routing entry for 10.4.0.0/24"
  - device: RR
    command: "show bgp vpnv4 unicast all 10.4.0.0/24"
    expect_regex: "1 available"
rollback_verify:
  - device: PE1
    command: "show ip route vrf CUST 10.4.0.0"
    expect_regex: "Routing entry for 10.4.0.0/24"
  - device: PE2
    command: "show ip route vrf CUST 10.4.0.0"
    expect_regex: "Routing entry for 10.4.0.0/24"
  - device: RR
    command: "show bgp vpnv4 unicast all 10.4.0.0/24"
    expect_regex: "1 available"
